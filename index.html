<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Neon Student Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #050505;
            color: #00f2ff; /* Neónová modrá */
        }

        h1 {
            text-align: center;
            font-size: 40px;
            text-shadow: 0 0 10px #00f2ff, 0 0 20px #0066ff;
            margin-bottom: 10px;
        }

        #students-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: #111;
            border: 2px solid #00f2ff;
            border-radius: 15px;
            width: 220px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }

        .card h3 {
            font-size: 18px;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nickname {
            color: #ff00ff; /* Neónová ružová pre prezývku */
            font-style: italic;
            font-size: 14px;
            text-shadow: 0 0 5px #ff00ff;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            margin-top: 50px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>👨‍💻 Neon Student API</h1>

    <div id="students-container">
        <div class="loading">Sťahujem dáta z backendu...</div>
    </div>

    <script>
        const container = document.getElementById("students-container");

        // Skúsime najprv tvoj lokálny Flask, ak nepôjde (si na Githube), skúsime api.json
        const API_URL = "http://127.0.0.1:5000/api";
        const BACKUP_URL = "api.json"; 

        async function loadStudents() {
            try {
                // Pokus o sťahovanie z Flasku
                let res = await fetch(API_URL).catch(() => fetch(BACKUP_URL));
                
                if (!res.ok) throw new Error("Chyba pripojenia");
                
                let data = await res.json();
                
                // Vyčistíme kontajner (odstránime loading text)
                container.innerHTML = "";

                // Na tvojom backende máš študentov v databaza["students"]
                // Ak ti API vráti objekt, vyberieme z neho students, inak použijeme dáta priamo
                const studentsArray = data.students ? data.students : data;

                studentsArray.forEach(student => {
                    const card = document.createElement("div");
                    card.className = "card";

                    // Obrázok študenta
                    const img = document.createElement("img");
                    img.src = student.image;
                    img.alt = student.name;

                    // Meno a priezvisko
                    const title = document.createElement("h3");
                    title.textContent = `${student.name} ${student.surname}`;

                    // Prezývka
                    const nick = document.createElement("p");
                    nick.className = "nickname";
                    nick.textContent = `"${student.nickname}"`;

                    // Poskladanie karty
                    card.appendChild(img);
                    card.appendChild(title);
                    card.appendChild(nick);

                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = `<p style="color:red">Chyba: Backend nie je spustený alebo súbor api.json chýba.</p>`;
                console.error(error);
            }
        }

        // Spustenie funkcie pri načítaní stránky
        loadStudents();
    </script>

</body>
</html>
