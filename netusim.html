<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Neon Student Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #00f2ff; /* Neónová modrá */
            
            /* ANIMOVANÉ POZADIE */
            background: linear-gradient(-45deg, #050505, #0a0a20, #150015, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Pohyb farieb na pozadí */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-align: center;
            font-size: 45px;
            text-shadow: 0 0 10px #00f2ff, 0 0 20px #0066ff;
            margin-bottom: 10px;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px #00f2ff, 0 0 20px #0066ff; }
            50% { transform: scale(1.05); text-shadow: 0 0 20px #00f2ff, 0 0 40px #0066ff; }
        }

        #students-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(0, 0, 0, 0.7); /* Polopriehľadná, aby vyniklo pozadie */
            border: 2px solid #00f2ff;
            border-radius: 15px;
            width: 220px;
            padding: 15px;
            text-align: center;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px); /* Rozmazanie pozadia pod kartou */
        }

        .card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.6);
            border-color: #ff00ff; /* Pri hoveri sa zmení na ružovú */
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #333;
            transition: 0.5s;
        }

        .card:hover img {
            filter: brightness(1.2) contrast(1.1);
        }

        .card h3 {
            font-size: 18px;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
        }

        .nickname {
            color: #ff00ff; /* Neónová ružová pre prezývku */
            font-style: italic;
            font-size: 14px;
            text-shadow: 0 0 5px #ff00ff;
        }

        .loading {
            text-align: center;
            font-size: 24px;
            margin-top: 50px;
            text-shadow: 0 0 10px #00f2ff;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <h1>👨‍💻 Neon Student API</h1>

    <div id="students-container">
        <div class="loading">Sťahujem dáta z neónovej siete...</div>
    </div>

    <script>
        const container = document.getElementById("students-container");

        // Skúsime najprv tvoj lokálny Flask, ak nepôjde (si na Githube), skúsime api.json
        const API_URL = "http://127.0.0.1:5000/api";
        const BACKUP_URL = "api.json"; 

        async function loadStudents() {
            try {
                // Pokus o sťahovanie z Flasku, ak zlyhá, ide na BACKUP_URL
                let res = await fetch(API_URL).catch(() => fetch(BACKUP_URL));
                
                if (!res.ok) throw new Error("Chyba pripojenia");
                
                let data = await res.json();
                
                container.innerHTML = "";

                // Ak dáta prišli ako objekt so zoznamom, alebo priamo ako pole
                const studentsArray = data.students ? data.students : data;

                studentsArray.forEach(student => {
                    const card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
                        <img src="${student.image}" alt="${student.name}">
                        <h3>${student.name} ${student.surname}</h3>
                        <p class="nickname">"${student.nickname}"</p>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = `<p style="color:red">Chyba: Backend nie je spustený alebo súbor api.json chýba.</p>`;
                console.error(error);
            }
        }

        loadStudents();
    </script>

</body>
</html>
